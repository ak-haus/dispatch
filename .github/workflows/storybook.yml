name: storybook
on: [push, pull_request]

# The S5 story gate (ADR-0003 §Stage 5, gate #9).
#
# BLOCKING: `storybook build` — deterministic; catches CSF/import/index/bundle
# errors across all 46 story files; its static artifact is what the S1 story
# lane consumes. Red = do-not-merge, fail-closed.
#
# REPORT-ONLY (the register-§8 calibration pattern — visible, not gating):
# the addon-vitest story-test rail. It is the S5 acceptance criterion and runs
# 343/343 with a11y-as-error locally (~35s), but vitest browser mode has a
# known, unresolved failure in GitHub Actions specifically — every file dies
# at import with "Failed to fetch dynamically imported module" regardless of
# parallelism/isolation shape (reproduced on 3 gate runs 2026-08-18/19;
# upstream: storybookjs/storybook#33347 "has workaround" open,
# vitest-dev/vitest#9509 "needs reproduction"). Filed as flag F9. RATCHET to
# blocking when upstream stabilizes, or when S1 swaps the CI runner
# (@storybook/test-runner against the built artifact is the recorded
# fallback). A gate that fails on upstream flake cries wolf and trains
# rubber-stamping — the ADR's own flake law.
jobs:
  storybook:
    name: storybook (stories + a11y gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: code/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: storybook build — BLOCKING (the static artifact the S1 story lane consumes)
        run: pnpm --fail-if-no-match --filter storybook build
      - name: upload static storybook (S1 story-lane input)
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: code/apps/storybook/storybook-static
          retention-days: 14
      - name: install chromium for the vitest browser rail
        continue-on-error: true
        run: pnpm --filter storybook exec playwright install chromium --with-deps
      - name: story tests — REPORT-ONLY in CI (F9; upstream vitest-browser CI defect), blocking locally
        continue-on-error: true
        run: |
          pnpm --fail-if-no-match --filter storybook test \
            && echo "::notice title=story tests::343 stories green (a11y as error)" \
            || echo "::warning title=story tests (report-only, F9)::story-test rail failed in CI — known upstream vitest-browser Actions defect (storybookjs/storybook#33347, vitest-dev/vitest#9509). The rail is BLOCKING locally (pnpm --filter storybook test). Ratchet this step to blocking when upstream stabilizes."
