name: storybook
on: [push, pull_request]

# The S5 story gate (ADR-0003 §Stage 5, gate #9): the component-doc surface
# must BUILD (its static artifact is what the S1 story lane consumes) and
# every story must PASS its story test — a real headless-Chromium render with
# addon-a11y violations as errors (preview a11y.test = "error"). This is the
# ADR's acceptance criterion as machine law: run-story-tests + a11y green,
# never story existence. Red = do-not-merge, fail-closed.
#
# The tokens prebuild is LOAD-BEARING: @prime-dispatch/tokens/css resolves to
# the package's dist/, which is BUILT, not committed (the drift gate tracks
# the astro-side copies). Without it, every downstream consumer fails —
# storybook build errors on the unresolvable import, and the vitest browser
# rail dies at the setup-module fetch (the 2026-08-19 "Failed to fetch
# dynamically imported module" rounds were exactly this, not upstream flake).
#
# The gate runs INSIDE the pinned Playwright container, the image e2e.yml
# uses (F24), because the image ships Chromium and every system library it
# needs. The runner used to fetch those libraries from Ubuntu's apt mirror on
# every run (`playwright install-deps`). On 2026-10-22 that mirror crawled
# through the font packages, the step hit its 10-minute timeout, and this
# required context failed on a checkpoint PR (#82) that changed no code,
# before a single story had run. That was the F15 CDN-stall class moved from
# Playwright's CDN to apt. The fix Playwright documents is the container:
# there is now no download left in this job to stall.
jobs:
  playwright-image:
    # Same derivation as e2e.yml: the image tag is a function of the
    # exact-pinned @playwright/test (F24), never typed into this file.
    name: derive the pinned Playwright image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.derive.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: derive
        # Two statements, not `echo "$(…)"`: a command substitution's failure
        # inside an argument is discarded under bash -e, which would green
        # this gate on the exact drift it exists to catch.
        run: |
          image="$(node code/apps/microsite-astro/scripts/playwright-container-image.mjs)"
          [ -n "$image" ]
          echo "image=$image" >> "$GITHUB_OUTPUT"

  storybook:
    # NOTE: this display name is a ruleset-REQUIRED check context (21012416).
    name: storybook (stories + a11y gate)
    # !cancelled(), as in e2e.yml: GitHub reports a skipped job as a success,
    # so a skipped required check would pass. If the derive job fails, this
    # runs with no container, and the parity step below reds it.
    if: ${{ !cancelled() }}
    needs: playwright-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.playwright-image.outputs.image }}
      # Chromium wants more shared memory than a job container's 64MB default.
      options: --ipc=host
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: code/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: tokens prebuild — dist/ is built, not committed (load-bearing for every step below)
        run: pnpm --fail-if-no-match --filter @prime-dispatch/tokens build
      - name: hydrate the PP font rail — S1 story-lane captures assert on shipped faces
        # The old hermetic-fontless posture ended with S1 (ADR-0003 §Stage 4):
        # staticDirs copies public/fonts into the storybook-static artifact the
        # Chromatic story lane captures from — fontless CI would baseline
        # fallback stacks. fetch-fonts.mjs is fail-loud on a missing binary.
        run: pnpm --fail-if-no-match --filter microsite-astro fetch:fonts
      # The image's Chromium belongs to ONE Playwright release, the e2e pin.
      # The vitest browser rail launches it through the storybook app's own
      # `playwright`, a caret range the lockfile resolves, so the two can drift
      # apart on a lockfile bump while the image still matches the pin. Assert
      # they agree, inside the required context, so drift reds this gate with a
      # reason instead of a missing-executable error (or, with no container at
      # all, a host with no browser).
      - name: F24 parity — the rail's playwright is the image's release
        run: |
          pinned="$(node -p "require('./apps/microsite-astro/package.json').devDependencies['@playwright/test']")"
          resolved="$(pnpm --filter storybook exec node -p "require('playwright/package.json').version")"
          if [ "$pinned" != "$resolved" ]; then
            echo "::error title=Playwright drift::storybook resolves playwright $resolved but the container image is pinned to $pinned (apps/microsite-astro @playwright/test). Align the two."
            exit 1
          fi
          if [ ! -d /ms-playwright ]; then
            echo "::error title=No Playwright image::this job is not running inside the pinned Playwright container (derive job failed?)"
            exit 1
          fi
      - name: story tests — every story renders + a11y green (addon-vitest)
        run: pnpm --fail-if-no-match --filter storybook test
      - name: isolation canary — a single story file must pass ALONE
        # Order-dependence detector: the suite's shared context (isolate:false)
        # can mask per-file defects that fire when a file runs first — the
        # 2026-08-19 mid-flight motion-scan failure surfaced exactly this way
        # (fails alone, passes in the suite). One cold file run keeps the
        # masking class visible; the settle discipline in vitest.setup.ts is
        # the cure this canary guards.
        run: pnpm --fail-if-no-match --filter storybook exec vitest run ../../packages/ui/src/components/custom/AgentTraceCallout/AgentTraceCallout.stories.tsx
      - name: storybook build — the static artifact the S1 story lane consumes
        # --stats-json emits preview-stats.json for TurboSnap (verified on
        # SB 9.1 + Vite locally 2026-08-19; Chromatic docs confirm native
        # Vite support in SB 8+ — Storybook's own CLI table is stale here).
        run: pnpm --fail-if-no-match --filter storybook exec storybook build --stats-json
      - name: upload static storybook (S1 story-lane input)
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: code/apps/storybook/storybook-static
          retention-days: 14

  # S1 story lane (ADR-0003 §Stage 4 wiring step 3): Chromatic Storybook mode
  # over gate #9's own artifact — the 343-story component surface. Push events
  # only: one upload per commit, and TurboSnap is incompatible with the
  # pull_request trigger's ephemeral merge commits (Chromatic troubleshooting
  # docs). TurboSnap is LOAD-BEARING here, not an optimization: 343 stories ≈
  # 14 full builds/mo on the 5,000-snapshot free tier; traced builds restore
  # the headroom (unlocks after ~10 CI builds). Policy A (register §2): PR
  # diffs are AK-dispositioned in the Chromatic UI; main auto-accepts so the
  # baseline follows merged truth.
  chromatic-stories:
    name: chromatic (story lane)
    needs: storybook
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: Chromatic baselines + TurboSnap ancestry need it.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: code/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: code/apps/storybook/storybook-static
      - name: TurboSnap guard — a missing stats file silently disables tracing
        run: test -f apps/storybook/storybook-static/preview-stats.json || { echo "::error title=TurboSnap disarmed::preview-stats.json missing from the storybook-static artifact — Chromatic would silently fall back to full snapshots and burn the free tier"; exit 1; }
      - name: chromatic story lane — upload gate-#9 artifact
        working-directory: code/apps/storybook
        env:
          # The dispatch_storybook project (AK-created 2026-08-19, repo-linked).
          # One Chromatic project per build type; dispatch_playwright carries
          # the e2e lane. The wire var name is what the CLI reads.
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_STORYBOOK_PROJECT_TOKEN }}
        run: pnpm exec chromatic --storybook-build-dir storybook-static --only-changed --exit-once-uploaded --auto-accept-changes main
