name: lighthouse
on: [push, pull_request]

# Perf budget as a ratchet (Golden Board A4): LCP/CLS/TBT + byte weight per
# surface, ceilings pinned ~15-25% over the 2026-08-18 baseline so a
# regression from today's floor fails CI. The known defects (home LCP,
# article CLS) live on the Golden Board as repair rows — fixing them
# tightens lighthouserc.cjs. Hermetic: static dist served locally.
jobs:
  lighthouse:
    name: lighthouse (budget ratchet)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: code/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:astro
      - id: lhci
        run: pnpm --filter microsite-astro lighthouse
      # lhci prints nothing when every assertion passes, so the ratchet's own
      # readings were invisible (F40). This prints them to the log and the step
      # summary on every run, and fails if a run measured the page without the
      # licensed PP faces.
      - name: the ratchet's figures (median per surface) + the PP-face guard
        if: ${{ !cancelled() && steps.lhci.outcome != 'skipped' }}
        working-directory: code/apps/microsite-astro
        run: node scripts/lighthouse-figures.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: lighthouse-results
          path: code/apps/microsite-astro/.lighthouseci/
          retention-days: 7
