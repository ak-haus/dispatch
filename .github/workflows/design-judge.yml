name: design-judge
on: [pull_request]

# Design-review evidence packet (ADR-0003 §Stage 4b, as RULED by AK
# 2026-08-19): **the judge for this lane is AK** — the LLM judge is
# superseded until AK decides otherwise. CI's job is to produce the
# deterministic evidence packet: journey surfaces × 2 viewports, captured
# under the same Playwright config as the e2e gate, uploaded as an
# artifact and linked on the PR for the Mayor's review.
#
# The model machinery stays in-tree, dormant (scripts/semantic-judge.mjs,
# pinned claude-sonnet-5). Re-arming is a register decision, never a CI
# edit alone: restore the judge + report steps here and fund the API key.
# Evidence basis for the ruling: wiki 16 / board flag R1 (no VLM validated
# for fine-grained design-defect detection; no shipped LLM-judge-as-gate
# precedent).
#
# Not a required check; red here means the evidence packet itself broke.
permissions:
  contents: read
  pull-requests: write
jobs:
  design-review:
    name: design-review (evidence packet)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: code/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: hydrate the PP font rail — the evidence must show shipped faces
        run: pnpm --fail-if-no-match --filter microsite-astro fetch:fonts
      # Playwright browsers are CACHED, not re-downloaded every run. The
      # `playwright install` step hits Playwright's CDN, and that CDN stalls:
      # three occurrences on record (23min on dispatch#16, 78min at the fonts
      # build, 3h39m on the S4 e2e lane 2026-08-19) where the step hung with
      # no output and no timeout, so the only remedy was a human noticing and
      # cancelling. A cache hit removes the download entirely.
      #
      # Keyed on the RESOLVED Playwright version, not the lockfile hash: the
      # browser build a release pins is what the cache holds, so an unrelated
      # dependency bump must not evict it.
      #
      # `install-deps` still runs on a hit — the browser binaries live in
      # ~/.cache/ms-playwright and are cached, but the OS-level libraries
      # `--with-deps` installs come from apt and are not.
      - name: resolve the pinned Playwright version
        id: playwright-version
        run: echo "version=$(pnpm --fail-if-no-match --filter microsite-astro exec node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: restore the Playwright browser cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
      - name: install chromium (cache miss only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: pnpm --fail-if-no-match --filter microsite-astro exec playwright install --with-deps chromium
      - name: system libraries for the cached chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 10
        run: pnpm --fail-if-no-match --filter microsite-astro exec playwright install-deps chromium
      - name: capture journey surfaces (same config, judge scope)
        working-directory: code/apps/microsite-astro
        run: pnpm e2e:build && pnpm exec playwright test --config playwright.judge.config.ts
      - name: upload the evidence packet
        uses: actions/upload-artifact@v4
        with:
          name: design-review-evidence
          path: code/apps/microsite-astro/test-results/judge-captures/
          retention-days: 14
      - name: link the packet on the PR (upsert one comment)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MARKER="<!-- design-review-evidence -->"
          COUNT=$(ls apps/microsite-astro/test-results/judge-captures/*.png | wc -l | tr -d ' ')
          {
            printf '%s\n\n' "$MARKER"
            echo "## Design-review evidence packet"
            echo
            echo "> The judge for this lane is **AK** (register §8 as ruled 2026-08-19; evidence: wiki 16 / board R1)."
            echo
            echo "$COUNT captures of the journey surfaces at two viewports, from this PR's build: [download the artifact](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) (\`design-review-evidence\`)."
          } > /tmp/evidence-comment.md
          EXISTING=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -1)
          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$EXISTING" -F body=@/tmp/evidence-comment.md > /dev/null
          else
            gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" -F body=@/tmp/evidence-comment.md > /dev/null
          fi
