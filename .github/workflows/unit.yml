name: unit
on: [push, pull_request]

# Vitest unit suites: the live wire logic (Golden Board A3 — store
# backoff/visibility discipline, the https content-trust contract guard,
# the snapshot script's keep-existing failure modes) and the packages/ui
# component suite (Golden Board A5 — 99 tests, repaired from write-only).
# Hermetic: fetch is mocked or pointed at throwaway localhost servers; no
# credentials.
jobs:
  unit:
    name: unit (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: code/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter microsite-astro test
      - run: pnpm --filter @prime-dispatch/ui test
