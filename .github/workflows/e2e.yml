name: e2e
on: [push, pull_request]

# Playwright journeys + axe over a LOCAL build (Golden Board A2). Phase A
# rules of law hold by construction: `test:e2e` bakes a reserved-.test-TLD
# fixture URL into the build and intercepts it in-page — production is never
# touched and no platform credential exists in this workflow.
jobs:
  e2e:
    name: e2e (playwright + axe)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: code/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --fail-if-no-match --filter microsite-astro exec playwright install --with-deps chromium
      - run: pnpm --fail-if-no-match --filter microsite-astro test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: code/apps/microsite-astro/playwright-report/
          retention-days: 7
