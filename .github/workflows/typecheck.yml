name: typecheck
on: [push, pull_request]

# tsc --noEmit across the TypeScript workspace packages (the "owed" gate).
# Coverage: microsite-next · storybook · cross-fire · ui · tokens. The live Astro
# surface (microsite-astro) typechecks via `astro check`, tracked separately (see AGENTS.md).
jobs:
  typecheck:
    name: typecheck (tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: code/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
