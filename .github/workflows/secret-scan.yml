# Secret scan (rule 1 of AK's PAI security rules: never commit a secret value) of the commits each
# push to main and each pull request adds, and of the full history on a manual run. A
# provider-format finding fails the job; a finding only from generic-api-key, jwt or jwt-base64 is a
# warning, the split the local pre-commit hook makes. Actions are pinned to a full-length commit
# SHA, and the gitleaks binary is checked against its release checksum before it runs.
name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks 8.30.1, checksum verified
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # The commits a push or pull request adds (the ranges gitleaks-action scans); the full
          # history on a manual run, or when the push's base commit is not in the clone.
          range=
          case "$EVENT" in
            pull_request) range="$PR_BASE..$PR_HEAD" ;;
            push) if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then range="$BEFORE..$AFTER"; fi ;;
          esac
          echo "Scanning ${range:-the full history}"
          status=0
          ./gitleaks git --redact --no-banner --exit-code 3 --report-format json --report-path findings.json ${range:+--log-opts="$range"} . || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then
            echo "::error::gitleaks failed (exit $status)"
            exit 1
          fi
          [ "$status" -eq 3 ] || exit 0
          # Provider-format findings fail the job; low-confidence rules only warn.
          warn='["generic-api-key","jwt","jwt-base64"]'
          jq -r --argjson warn "$warn" '.[] | (if (.RuleID | IN($warn[])) then "warning" else "error" end) as $level
            | "::\($level) file=\(.File),line=\(.StartLine),title=gitleaks \(.RuleID)::\(.RuleID) at \(.File):\(.StartLine) in commit \(.Commit[0:12]). If it is not a secret, add gitleaks:allow to the line or \(.Fingerprint) to .gitleaksignore."' findings.json
          blocking=$(jq --argjson warn "$warn" '[.[] | select(.RuleID | IN($warn[]) | not)] | length' findings.json)
          echo "$blocking blocking finding(s)"
          [ "$blocking" -eq 0 ]
